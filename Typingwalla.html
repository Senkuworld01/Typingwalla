<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Typing Master Pro</title>

<style>
body {
  font-family: Arial;
  background: #eaf0f6;
  margin: 0;
}

.header {
  background: #007BFF;
  color: white;
  padding: 15px;
  text-align: center;
  font-size: 24px;
}

.main {
  display: flex;
  padding: 20px;
  gap: 20px;
}

/* LEFT SIDE */
.left {
  width: 70%;
  background: white;
  padding: 20px;
  border-radius: 10px;
}

#text {
  font-size: 20px;
  line-height: 1.6;
  background: #f5f5f5;
  padding: 15px;
  height: 200px;
  overflow-y: auto;
}

textarea {
  width: 100%;
  height: 150px;
  margin-top: 10px;
  font-size: 18px;
  padding: 10px;
}

/* RIGHT SIDE */
.right {
  width: 30%;
  background: white;
  padding: 20px;
  border-radius: 10px;
}

select, button {
  width: 100%;
  padding: 10px;
  margin-top: 10px;
}

#timer {
  font-size: 22px;
  color: red;
  text-align: center;
  margin-top: 10px;
}

#result {
  margin-top: 20px;
  font-size: 18px;
}
</style>

</head>

<body>

<div class="header">Typing Master Pro 🚀</div>

<div class="main">

  <!-- LEFT -->
  <div class="left">
    <p id="text"></p>
    <textarea id="input" placeholder="Start typing here..."></textarea>
  </div>

  <!-- RIGHT -->
  <div class="right">

    <select id="language" onchange="loadLessons()">
      <option value="english">English</option>
      <option value="hindi">Hindi</option>
    </select>

    <select id="lesson" onchange="changeText()"></select>

    <select id="timeSelect">
      <option value="60">1 Minute</option>
      <option value="120">2 Minute</option>
      <option value="300">5 Minute</option>
      <option value="600">10 Minute</option>
    </select>

    <button onclick="startTest()">Start Test</button>

    <div id="timer">Time: 0s</div>

    <div id="result"></div>

  </div>

</div>

<script>

// SAME LESSONS (short demo, तुम अपना previous वाला use करो)
const englishLessons = ["Practice typing daily to improve your speed and accuracy."];
const hindiLessons = ["रोज टाइपिंग का अभ्यास करें और अपनी गति बढ़ाएं।"];

let timeLeft, timer, startTime;

function loadLessons() {
  let lang = document.getElementById("language").value;
  let lessonDropdown = document.getElementById("lesson");
  lessonDropdown.innerHTML = "";

  let lessons = (lang === "english") ? englishLessons : hindiLessons;

  lessons.forEach((_, i) => {
    let opt = document.createElement("option");
    opt.value = i;
    opt.text = "Lesson " + (i + 1);
    lessonDropdown.appendChild(opt);
  });

  changeText();
}

function changeText() {
  let lang = document.getElementById("language").value;
  let lessonIndex = document.getElementById("lesson").value;
  let lessons = (lang === "english") ? englishLessons : hindiLessons;

  document.getElementById("text").innerText = lessons[lessonIndex];
}

function startTest() {
  startTime = new Date().getTime();
  document.getElementById("input").value = "";

  timeLeft = parseInt(document.getElementById("timeSelect").value);

  timer = setInterval(() => {
    timeLeft--;
    document.getElementById("timer").innerText = "Time: " + timeLeft + "s";

    if (timeLeft === 0) {
      clearInterval(timer);
      checkTyping();
    }
  }, 1000);
}

function checkTyping() {
  let endTime = new Date().getTime();
  let timeTaken = (endTime - startTime) / 1000;

  let originalText = document.getElementById("text").innerText;
  let userText = document.getElementById("input").value;

  let words = userText.trim().split(" ").length;
  let speed = Math.round((words / timeTaken) * 60);

  let correct = 0;
  for (let i = 0; i < userText.length; i++) {
    if (userText[i] === originalText[i]) correct++;
  }

  let accuracy = Math.round((correct / originalText.length) * 100);

  document.getElementById("result").innerText =
    "Speed: " + speed + " WPM\nAccuracy: " + accuracy + "%";
}

loadLessons();

</script>

</body>
</html>
